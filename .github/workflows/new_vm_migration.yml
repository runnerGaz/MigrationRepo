name: Migrate Nginx Application

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_VM_USER: azureuser
      TARGET_VM_USER: azureuser
      SOURCE_VM_IP: ${{ secrets.SOURCE_VM_IP }}
      TARGET_VM_IP: ${{ secrets.TARGET_VM_IP }}

    steps:
      - name: Validate secrets
        env:
          SOURCE_VM_SSH_KEY: ${{ secrets.SOURCE_VM_SSH_KEY }}
          TARGET_VM_SSH_KEY: ${{ secrets.TARGET_VM_SSH_KEY }}
        run: |
          [ -n "$SOURCE_VM_IP" ] || {
            echo "SOURCE_VM_IP secret is missing"
            exit 1
          }

          [ -n "$TARGET_VM_IP" ] || {
            echo "TARGET_VM_IP secret is missing"
            exit 1
          }

          [ -n "$SOURCE_VM_SSH_KEY" ] || {
            echo "SOURCE_VM_SSH_KEY secret is missing"
            exit 1
          }

          [ -n "$TARGET_VM_SSH_KEY" ] || {
            echo "TARGET_VM_SSH_KEY secret is missing"
            exit 1
          }

          echo "All required secrets are configured."

      - name: Configure SSH keys
        env:
          SOURCE_VM_SSH_KEY: ${{ secrets.SOURCE_VM_SSH_KEY }}
          TARGET_VM_SSH_KEY: ${{ secrets.TARGET_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SOURCE_VM_SSH_KEY" |
            tr -d '\r' > ~/.ssh/source_key

          printf '%s\n' "$TARGET_VM_SSH_KEY" |
            tr -d '\r' > ~/.ssh/target_key

          chmod 600 ~/.ssh/source_key
          chmod 600 ~/.ssh/target_key

      - name: Test source VM connection
        run: |
          ssh \
            -i ~/.ssh/source_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            "$SOURCE_VM_USER@$SOURCE_VM_IP" \
            "echo 'Successfully connected to source VM'"

      - name: Test target VM connection
        run: |
          ssh \
            -i ~/.ssh/target_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            "$TARGET_VM_USER@$TARGET_VM_IP" \
            "echo 'Successfully connected to target VM'"

      - name: Create archive on source VM
        run: |
          ssh \
            -i ~/.ssh/source_key \
            -o StrictHostKeyChecking=no \
            "$SOURCE_VM_USER@$SOURCE_VM_IP" \
            "sudo test -d /var/www/html &&
             sudo rm -f /tmp/nginx-site.tar.gz &&
             sudo tar -czf /tmp/nginx-site.tar.gz -C /var/www html &&
             sudo chown $SOURCE_VM_USER:$SOURCE_VM_USER /tmp/nginx-site.tar.gz &&
             ls -lh /tmp/nginx-site.tar.gz"

      - name: Download archive from source VM
        run: |
          scp \
            -i ~/.ssh/source_key \
            -o StrictHostKeyChecking=no \
            "$SOURCE_VM_USER@$SOURCE_VM_IP:/tmp/nginx-site.tar.gz" \
            ./nginx-site.tar.gz

          test -s ./nginx-site.tar.gz
          ls -lh ./nginx-site.tar.gz

      - name: Upload archive to target VM
        run: |
          scp \
            -i ~/.ssh/target_key \
            -o StrictHostKeyChecking=no \
            ./nginx-site.tar.gz \
            "$TARGET_VM_USER@$TARGET_VM_IP:/tmp/nginx-site.tar.gz"

      - name: Install Nginx and deploy application
        run: |
          ssh \
            -i ~/.ssh/target_key \
            -o StrictHostKeyChecking=no \
            "$TARGET_VM_USER@$TARGET_VM_IP" << 'EOF'
          set -e

          export DEBIAN_FRONTEND=noninteractive

          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y nginx
          fi

          test -s /tmp/nginx-site.tar.gz

          if [ -d /var/www/html ]; then
            sudo rm -rf /var/www/html.backup
            sudo cp -a /var/www/html /var/www/html.backup
          fi

          sudo rm -rf /var/www/html
          sudo tar -xzf /tmp/nginx-site.tar.gz -C /var/www

          sudo chown -R www-data:www-data /var/www/html
          sudo find /var/www/html -type d -exec chmod 755 {} \;
          sudo find /var/www/html -type f -exec chmod 644 {} \;

          sudo nginx -t
          sudo systemctl enable nginx
          sudo systemctl restart nginx
          sudo systemctl is-active --quiet nginx

          echo "Application deployed successfully."
          EOF

      - name: Verify target application
        run: |
          for attempt in 1 2 3 4 5; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              "http://$TARGET_VM_IP"; then
              echo
              echo "Migration completed successfully."
              exit 0
            fi

            echo "Verification attempt $attempt failed."
            sleep 5
          done

          echo "Application verification failed."
          echo "Ensure TCP port 80 is allowed in the target VM Azure NSG."
          exit 1

      - name: Clean up
        if: always()
        run: |
          ssh \
            -i ~/.ssh/source_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=5 \
            "$SOURCE_VM_USER@$SOURCE_VM_IP" \
            "sudo rm -f /tmp/nginx-site.tar.gz" 2>/dev/null || true

          ssh \
            -i ~/.ssh/target_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=5 \
            "$TARGET_VM_USER@$TARGET_VM_IP" \
            "sudo rm -f /tmp/nginx-site.tar.gz" 2>/dev/null || true

          rm -f ./nginx-site.tar.gz
          rm -f ~/.ssh/source_key ~/.ssh/target_key
